apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: azure-otel
spec:
  mode: deployment
  replicas: 2
  envFrom:
    - secretRef:
        name: otel-collector-secrets
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  # Expose the prometheus-exporter port so the PodMonitor below can scrape it.
  # The operator already exposes OTLP ports (4317/4318) and the collector's
  # internal telemetry port (8888) automatically.
  ports:
    - name: prom
      port: 8889
      protocol: TCP
  config:
    extensions:
      health_check: {}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 2s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 8192
        timeout: 5s
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      # Map OTel resource attributes → Prometheus labels expected by the
      # step-02 dashboards (`service`, `k8s_namespace`, `k8s_pod`).
      # Note: OTel Operator auto-injects OTEL_SERVICE_NAME = deployment name
      # (e.g. `azure-otel-python`), but the dashboards filter by the short
      # form (`python`/`spring`/`nodejs`). Strip the `azure-otel-` prefix
      # when building the `service` label so existing dashboards keep working.
      transform/prom_labels:
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service"], attributes["service.name"]) where attributes["service.name"] != nil
              - replace_pattern(attributes["service"], "^azure-otel-", "") where attributes["service"] != nil
              - set(attributes["k8s_namespace"], attributes["k8s.namespace.name"]) where attributes["k8s.namespace.name"] != nil
              - set(attributes["k8s_pod"], attributes["k8s.pod.name"]) where attributes["k8s.pod.name"] != nil
      # Drop health-check / probe spans before they reach App Insights.
      # Matches both server-side requests and outbound HTTP client calls
      # against /health, /healthz, /livez, /readyz (any case, with optional
      # query string). Span.kind filter avoids accidentally dropping unrelated
      # internal spans whose names happen to contain those words.
      filter/drop_healthchecks:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(name, "(?i)^(GET |HEAD |)/?(health|healthz|livez|readyz)/?$")'
            - 'IsMatch(attributes["http.route"], "(?i)^/?(health|healthz|livez|readyz)/?$")'
            - 'IsMatch(attributes["http.target"], "(?i)^/?(health|healthz|livez|readyz)(\\?.*)?$")'
            - 'IsMatch(attributes["url.path"], "(?i)^/?(health|healthz|livez|readyz)$")'
    exporters:
      azuremonitor:
        connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
        maxbatchsize: 1024
        maxbatchinterval: 10s
      prometheus:
        endpoint: 0.0.0.0:8889
        send_timestamps: true
        metric_expiration: 5m
        resource_to_telemetry_conversion:
          enabled: true
        # Append the OTLP unit as a suffix (e.g. `..._seconds`, `..._bytes`).
        # Step-02 dashboards depend on the unit-suffixed names that SDKs
        # produced when they exposed Prometheus directly:
        #   spring  -> http_server_request_duration_seconds_count
        #   python  -> http_server_duration_milliseconds_count
        #   nodejs  -> http_server_duration_count   (no unit on the OTLP metric)
        add_metric_suffixes: true
    service:
      extensions: [health_check]
      pipelines:
        traces:
          # filter runs before batch so dropped spans never count against
          # batch size and never hit the azuremonitor exporter.
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, filter/drop_healthchecks, batch]
          exporters: [azuremonitor]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform/prom_labels, batch]
          exporters: [prometheus]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-k8sattributes
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch]
  - apiGroups: [extensions]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: azure-otel
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: otel-collector
  namespace: azure-otel
  labels:
    release: azure-otel
spec:
  namespaceSelector:
    matchNames:
      - azure-otel
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  podMetricsEndpoints:
    - port: prom
      path: /metrics
      interval: 30s
      scrapeTimeout: 25s
      scheme: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: collector_namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: collector_pod
