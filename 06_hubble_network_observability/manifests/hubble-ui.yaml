# Hubble UI — web frontend for Cilium Hubble flow observation.
# Deploys in kube-system (same namespace as hubble-relay and TLS certs).
#
# Components:
#   - hubble-ui-backend: gRPC client → hubble-relay (mTLS)
#   - hubble-ui (frontend): serves the React SPA on :8081
#
# DEBUG: If UI shows "No flows", generate traffic first:
#   curl http://<AGFC>/api/items
# DEBUG: If backend can't connect to relay, check logs:
#   kubectl -n kube-system logs deploy/hubble-ui -c backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hubble-ui
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hubble-ui
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hubble-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hubble-ui
subjects:
  - kind: ServiceAccount
    name: hubble-ui
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-ui-nginx
  namespace: kube-system
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;
        root /patched;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://localhost:8090/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-ui
  namespace: kube-system
  labels:
    k8s-app: hubble-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: hubble-ui
  template:
    metadata:
      labels:
        k8s-app: hubble-ui
    spec:
      serviceAccountName: hubble-ui
      initContainers:
        - name: patch-basepath
          image: quay.io/cilium/hubble-ui:v0.13.1
          command: ['/bin/sh', '-c']
          args:
            - |
              cp -r /app/* /patched/
              cd /patched
              sed -i 's#<base href="/"#<base href="/hubble/"#g' index.html
              sed -i 's#basename||"/"#basename||"/hubble"#g' bundle.main.*.js
          volumeMounts:
            - name: patched-app
              mountPath: /patched
      containers:
        - name: frontend
          image: quay.io/cilium/hubble-ui:v0.13.1
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: patched-app
              mountPath: /patched
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
        - name: backend
          image: quay.io/cilium/hubble-ui-backend:v0.13.1
          ports:
            - containerPort: 8090
              name: grpc
          env:
            - name: EVENTS_SERVER_PORT
              value: "8090"
            - name: FLOWS_API_ADDR
              value: "hubble-relay.kube-system.svc.cluster.local:443"
            - name: TLS_TO_RELAY_ENABLED
              value: "true"
            - name: TLS_RELAY_CA_CERT_FILES
              value: /var/run/hubble-relay-tls/ca.crt
            - name: TLS_RELAY_CLIENT_CERT_FILE
              value: /var/run/hubble-relay-tls/tls.crt
            - name: TLS_RELAY_CLIENT_KEY_FILE
              value: /var/run/hubble-relay-tls/tls.key
            - name: TLS_RELAY_SERVER_NAME
              value: "*.hubble-relay.cilium.io"
          volumeMounts:
            - name: hubble-relay-tls
              mountPath: /var/run/hubble-relay-tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: patched-app
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: hubble-ui-nginx
        - name: hubble-relay-tls
          secret:
            secretName: hubble-relay-client-certs
---
apiVersion: v1
kind: Service
metadata:
  name: hubble-ui
  namespace: kube-system
  labels:
    k8s-app: hubble-ui
spec:
  selector:
    k8s-app: hubble-ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
