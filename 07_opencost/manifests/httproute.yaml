apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencost
  namespace: opencost
spec:
  parentRefs:
    - name: azure-otel-gw
      namespace: azure-otel
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /opencost
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: opencost
          port: 9090
