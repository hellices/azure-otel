# HTTPRoute must live in azure-otel namespace (same as the Gateway).
# Cross-namespace backendRef requires a ReferenceGrant in the target namespace.
#
# DEBUG: If route shows "NotAllowedByListeners", the Gateway's
#   allowedRoutes.namespaces.from is "Same" — move the route to the gateway NS.
# DEBUG: If route shows "RefNotPermitted", the ReferenceGrant below is missing.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-azure-otel-to-opencost
  namespace: opencost
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: azure-otel
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencost
  namespace: azure-otel
spec:
  parentRefs:
    - name: azure-otel-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /opencost
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: opencost
          namespace: opencost
          port: 9090
