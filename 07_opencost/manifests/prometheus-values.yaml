# Minimal Prometheus values for OpenCost usage data.
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus prometheus-community/prometheus \
#     -n prometheus-system --create-namespace \
#     -f 07_opencost/manifests/prometheus-values.yaml
#
# This is a lightweight Prometheus instance that only scrapes kubelet and
# kube-state-metrics for OpenCost. It does NOT replace Azure Managed
# Prometheus (AMA/AMW) — they coexist independently.
#
# DEBUG: Verify Prometheus is scraping targets:
#   kubectl -n prometheus-system port-forward svc/prometheus-server 9090:80
#   open http://localhost:9090/targets  (kubelet + kube-state-metrics should be UP)
# DEBUG: If OpenCost shows $0 for everything, Prometheus can't reach kubelet.
#   Check: curl localhost:9090/api/v1/query?query=container_cpu_usage_seconds_total
#   If empty, check RBAC — the prometheus-server SA needs cluster-wide read.

server:
  persistentVolume:
    size: 8Gi
  retention: "7d"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# Only scrape what OpenCost needs
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        metrics_path: /metrics/cadvisor

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - "prometheus-kube-state-metrics.prometheus-system.svc:8080"

# Enable kube-state-metrics (required for OpenCost)
kube-state-metrics:
  enabled: true

# Disable components OpenCost doesn't need
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
