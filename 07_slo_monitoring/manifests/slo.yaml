# Sloth SLO definitions for the azure-otel sample apps.
#
# Generate Prometheus recording + alert rules:
#   sloth generate -i 07_slo_monitoring/manifests/slo.yaml \
#     -o 07_slo_monitoring/manifests/generated-rules.yaml
#
# Then apply to in-cluster Prometheus (step 07):
#   kubectl apply -f 07_slo_monitoring/manifests/generated-rules.yaml
#
# Metrics reference (from step 02 OTel auto-instrumentation + PodMonitor):
#   Node.js / Python:
#     http_server_duration_milliseconds_count{service, http_status_code, http_method}
#     http_server_duration_milliseconds_bucket{service, http_status_code, http_method, le}
#   Spring (Java):
#     http_server_request_duration_seconds_count{service, http_response_status_code, http_route}
#     http_server_request_duration_seconds_bucket{service, http_response_status_code, http_route, le}
#
# DEBUG: After generating, verify metric names match your cluster:
#   kubectl port-forward -n prometheus-system svc/prometheus-server 9090:80
#   curl -s 'http://localhost:9090/api/v1/label/__name__/values' | jq '.data[]' | grep http_server
# DEBUG: If all SLIs return NaN, metrics aren't flowing — check PodMonitor + OTel Instrumentation CR.

version: "prometheus/v1"
service: "azure-otel-apps"
labels:
  owner: "platform-team"
  repo: "azure-otel"
slos:
  # ── HTTP availability (all services) ───────────────────────────
  # "99.9% of requests return a non-5xx response"
  # Combines Node.js/Python (milliseconds metric) + Spring (seconds metric)
  - name: "http-availability"
    objective: 99.9
    description: "HTTP request success rate (non-5xx) across all services"
    sli:
      events:
        error_query: >
          (
            sum(rate(http_server_duration_milliseconds_count{
              namespace="azure-otel",
              http_status_code=~"5.."
            }[{{.window}}])) or vector(0)
          )
          +
          (
            sum(rate(http_server_request_duration_seconds_count{
              namespace="azure-otel",
              http_response_status_code=~"5.."
            }[{{.window}}])) or vector(0)
          )
        total_query: >
          (
            sum(rate(http_server_duration_milliseconds_count{
              namespace="azure-otel"
            }[{{.window}}])) or vector(0)
          )
          +
          (
            sum(rate(http_server_request_duration_seconds_count{
              namespace="azure-otel"
            }[{{.window}}])) or vector(0)
          )
    alerting:
      name: "HTTPHighErrorRate"
      labels:
        category: availability
      annotations:
        summary: "High HTTP 5xx error rate — SLO burn rate exceeded"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  # ── HTTP latency (Node.js + Python only) ────────────────────────
  # "99% of requests complete in under 500ms"
  # Uses milliseconds metric; le="500" = 500ms threshold
  # Spring uses a seconds metric (different unit), handled separately if needed
  - name: "http-latency-p99"
    objective: 99
    description: "99th percentile HTTP latency under 500ms (Node.js + Python)"
    sli:
      events:
        error_query: >
          (
            sum(rate(http_server_duration_milliseconds_count{
              namespace="azure-otel"
            }[{{.window}}]))
            -
            sum(rate(http_server_duration_milliseconds_bucket{
              namespace="azure-otel",
              le="500"
            }[{{.window}}]))
          )
        total_query: >
          sum(rate(http_server_duration_milliseconds_count{
            namespace="azure-otel"
          }[{{.window}}]))
    alerting:
      name: "HTTPHighLatency"
      labels:
        category: latency
      annotations:
        summary: "p99 latency exceeds 500ms — SLO burn rate exceeded"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  # ── Per-service: Spring backend availability ────────────────────
  # Individual SLO for the Spring backend (most likely to degrade)
  - name: "spring-availability"
    objective: 99.5
    description: "Spring backend HTTP success rate"
    sli:
      events:
        error_query: >
          sum(rate(http_server_request_duration_seconds_count{
            namespace="azure-otel",
            service="spring",
            http_response_status_code=~"5.."
          }[{{.window}}]))
        total_query: >
          sum(rate(http_server_request_duration_seconds_count{
            namespace="azure-otel",
            service="spring"
          }[{{.window}}]))
    alerting:
      name: "SpringHighErrorRate"
      labels:
        category: availability
        service: spring
      annotations:
        summary: "Spring backend 5xx rate — SLO burn rate exceeded"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
