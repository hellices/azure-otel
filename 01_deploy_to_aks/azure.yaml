name: azure-otel-aks
metadata:
  template: azure-otel@0.1.0
infra:
  provider: bicep
  path: infra
  module: main
hooks:
  preprovision:
    shell: sh
    run: ./infra/hooks/preprovision.sh
    interactive: true
    continueOnError: false
    windows:
      shell: pwsh
      run: ./infra/hooks/preprovision.ps1
  postprovision:
    shell: sh
    run: ./infra/hooks/postprovision.sh
    interactive: true
    continueOnError: false
    windows:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
