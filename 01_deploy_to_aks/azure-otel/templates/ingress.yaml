{{- if .Values.gateway.enabled }}
{{- $nodeCtx := dict "root" . "svc" .Values.nodejs "key" "nodejs" }}
{{- $pyCtx   := dict "root" . "svc" .Values.python "key" "python" }}
{{- $apiPrefix := .Values.gateway.apiPathPrefix | default "/api" }}
# ---------- ApplicationLoadBalancer CR ----------
# ALB Controller watches this and provisions the AGFC resource + associates
# the delegated subnet.  Requires gateway.subnetId to be set at install time.
apiVersion: alb.networking.azure.io/v1
kind: ApplicationLoadBalancer
metadata:
  name: {{ .Values.gateway.albName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-otel.commonLabels" $nodeCtx | nindent 4 }}
spec:
  associations:
  - {{ .Values.gateway.subnetId | quote }}
---
# ---------- Gateway ----------
# References the ApplicationLoadBalancer above via annotations.
# gatewayClassName azure-alb-external is registered by the ALB Controller add-on.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-otel.commonLabels" $nodeCtx | nindent 4 }}
  annotations:
    alb.networking.azure.io/alb-namespace: {{ .Release.Namespace }}
    alb.networking.azure.io/alb-name: {{ .Values.gateway.albName }}
spec:
  gatewayClassName: azure-alb-external
  listeners:
  - name: http
    port: {{ .Values.gateway.listener.port }}
    protocol: {{ .Values.gateway.listener.protocol }}
    allowedRoutes:
      namespaces:
        from: Same
---
# ---------- HTTPRoute: web (/ -> nodejs SPA) ----------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-otel.commonLabels" $nodeCtx | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Release.Name }}-gw
    namespace: {{ .Release.Namespace }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "azure-otel.fullname" $nodeCtx }}
      port: {{ .Values.nodejs.service.port }}
---
# ---------- HTTPRoute: api (/api -> python, strip /api prefix) ----------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-otel.commonLabels" $pyCtx | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Release.Name }}-gw
    namespace: {{ .Release.Namespace }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ $apiPrefix }}
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: {{ include "azure-otel.fullname" $pyCtx }}
      port: {{ .Values.python.service.port }}
{{- end }}
