{{- range $key, $svc := dict "spring" .Values.spring "python" .Values.python "nodejs" .Values.nodejs }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "svc" $svc "key" $key }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "azure-otel.fullname" $ctx }}
  labels:
    {{- include "azure-otel.commonLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount }}
  {{- if and (eq $key "spring") $svc.persistence.enabled }}
  # RWO PVC + RollingUpdate deadlocks (new pod can't attach the volume).
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "azure-otel.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "azure-otel.commonLabels" $ctx | nindent 8 }}
      {{- if $.Values.otel.enabled }}
      annotations:
        {{- $lang := index (dict "spring" "java" "python" "python" "nodejs" "nodejs") $key }}
        instrumentation.opentelemetry.io/inject-{{ $lang }}: {{ $.Values.otel.instrumentationName | quote }}
        instrumentation.opentelemetry.io/container-names: {{ $svc.name | quote }}
      {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ include "azure-otel.image" $ctx }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
              protocol: TCP
            {{- if $.Values.otel.enabled }}
            - name: {{ $.Values.otel.metricsPortName }}
              containerPort: {{ $.Values.otel.metricsPort }}
              protocol: TCP
            {{- end }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if eq $key "python" }}
            {{- if not (hasKey $svc.env "JAVA_API_BASE_URL") }}
            - name: JAVA_API_BASE_URL
              value: "http://{{ $.Release.Name }}-{{ $.Values.spring.name }}:{{ $.Values.spring.service.port }}"
            {{- end }}
            {{- end }}
            {{- if eq $key "nodejs" }}
            {{- if not (hasKey $svc.env "PYTHON_API_BASE_URL") }}
            {{- $public := $svc.pythonPublicBaseUrl -}}
            {{- if and (not $public) $.Values.gateway.enabled -}}
              {{- $public = $.Values.gateway.apiPathPrefix -}}
            {{- end }}
            - name: PYTHON_API_BASE_URL
              value: {{ $public | quote }}
            {{- end }}
            {{- if not (hasKey $svc.env "PYTHON_INTERNAL_URL") }}
            - name: PYTHON_INTERNAL_URL
              value: "http://{{ $.Release.Name }}-{{ $.Values.python.name }}:{{ $.Values.python.service.port }}"
            {{- end }}
            {{- end }}
          {{- with $svc.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and (eq $key "spring") $svc.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ $svc.persistence.mountPath }}
          {{- end }}
      {{- if and (eq $key "spring") $svc.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "azure-otel.fullname" $ctx }}-data
      {{- end }}
{{- end }}
{{- end }}
