{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.spring.enabled .Values.spring.enabled }}
{{- $ctx := dict "root" . "svc" .Values.spring "key" "spring" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "azure-otel.fullname" $ctx }}-allow-from-python
  labels:
    {{- include "azure-otel.commonLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "azure-otel.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.python.name }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.spring.containerPort }}
    {{- if and .Values.otel.enabled .Values.otel.scrapeNetworkPolicy }}
    # Allow AKS managed Prometheus (ama-metrics) to scrape the OTel exporter.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              rsName: ama-metrics
      ports:
        - protocol: TCP
          port: {{ .Values.otel.metricsPort }}
    {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.python.enabled .Values.python.enabled }}
{{- $ctx := dict "root" . "svc" .Values.python "key" "python" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "azure-otel.fullname" $ctx }}-allow-edge
  labels:
    {{- include "azure-otel.commonLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "azure-otel.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.nodejs.name }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.networkPolicy.python.ingressNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.python.containerPort }}
{{- end }}
