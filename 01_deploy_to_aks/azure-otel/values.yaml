# Default values for azure-otel umbrella chart.
# Override per-environment with `helm install/upgrade -f values-dev.yaml`.

global:
  image:
    registry: ghcr.io
    repository: hellices/azure-otel   # single OCI repo, services differentiated by tag prefix
    pullPolicy: IfNotPresent
  imagePullSecrets: []

# ---- Service: spring-java (CRUD + embedded SQLite) ----
spring:
  enabled: true
  name: spring
  imageTag: spring-java-latest        # final image: <registry>/<repository>:<imageTag>
  replicaCount: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  env:
    PORT: "8080"
    SQLITE_PATH: "/data/items.db"
  persistence:
    enabled: true
    storageClassName: ""              # "" -> default StorageClass on AKS (managed-csi)
    accessModes: [ReadWriteOnce]
    size: 1Gi
    mountPath: /data
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  livenessProbe:
    httpGet: { path: /health, port: 8080 }
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet: { path: /health, port: 8080 }
    initialDelaySeconds: 10
    periodSeconds: 5

# ---- Service: python (FastAPI edge / proxy) ----
python:
  enabled: true
  name: python
  imageTag: python-latest
  replicaCount: 1
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  # JAVA_API_BASE_URL is auto-derived from the Spring service unless overridden here.
  env:
    PORT: "8000"
    LOG_LEVEL: "INFO"
    ALLOWED_ORIGINS: "*"
    HTTP_TIMEOUT_SECONDS: "5"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  livenessProbe:
    httpGet: { path: /health, port: 8000 }
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet: { path: /health, port: 8000 }
    initialDelaySeconds: 5
    periodSeconds: 5

# ---- Service: nodejs (Next.js SPA shell) ----
nodejs:
  enabled: true
  name: nodejs
  imageTag: nodejs-latest
  replicaCount: 1
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
  # PYTHON_API_BASE_URL is served to the BROWSER via /config.js, so it must be a
  # publicly reachable URL (NOT a cluster-internal DNS name).
  #   - When gateway.enabled=true, leaving this empty makes the SPA call the
  #     same origin under /api (AGFC routes /api -> python, stripping the prefix).
  #   - Otherwise, set it to the public URL of the FastAPI edge.
  pythonPublicBaseUrl: "/api"
  env:
    PORT: "3000"
    NODE_ENV: "production"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  livenessProbe:
    httpGet: { path: /healthz, port: 3000 }
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet: { path: /healthz, port: 3000 }
    initialDelaySeconds: 5
    periodSeconds: 5

# ---- Public entry (Gateway API + Application Gateway for Containers) ----
# Requires the AKS ALB Controller add-on to be enabled on the cluster.
# azd up runs the postprovision hook which enables the add-on and sets
# gateway.subnetId automatically.
#
# When enabled, AGFC exposes:
#   /        -> nodejs   (SPA)
#   /api/*   -> python   (FastAPI edge; /api prefix is stripped before forwarding)
# Spring is intentionally NOT exposed; it is only reachable from Python pods
# inside the cluster (enforced by networkPolicy below).
gateway:
  enabled: true
  albName: "alb"              # Name for the ApplicationLoadBalancer CR
  subnetId: ""                # Set at install time via --set gateway.subnetId=...
  listener:
    port: 80
    protocol: HTTP
  # Path prefix matched by AGFC and stripped via URLRewrite before forwarding to python.
  apiPathPrefix: "/api"

# ---- OpenTelemetry auto-instrumentation (used by 02_metrics_via_podmonitor) ----
# When enabled, every app Deployment gets:
#   - a Pod-template annotation `instrumentation.opentelemetry.io/inject-<lang>`
#     so the OTel Operator's webhook injects the language SDK init container
#   - a named container port `otel-metrics: 9464` exposing the Prometheus exporter
# AKS managed Prometheus scrapes this port via the PodMonitor in step 02.
# It's safe to leave this on even before installing the Operator: the annotation
# is a no-op until the Instrumentation CR named in `instrumentationName` exists.
otel:
  enabled: true
  instrumentationName: azure-otel  # must match Instrumentation CR in same namespace
  metricsPort: 9464
  metricsPortName: otel-metrics
  # Allow ama-metrics (kube-system) to scrape :9464 even when default-deny
  # NetworkPolicy is in place. Only takes effect for services that already have
  # a NetworkPolicy (currently spring); nodejs/python have no NP and accept by default.
  scrapeNetworkPolicy: true

# ---- NetworkPolicy: enforce server-to-server calls stay inside the cluster ----
# Defaults ON for Spring (the database tier). When enabled, the cluster CNI
# plugin must support NetworkPolicy. AKS: Azure CNI Powered by Cilium, Calico,
# or Azure NPM all support it.
networkPolicy:
  enabled: true
  # Spring accepts traffic ONLY from Python pods in this release.
  spring:
    enabled: true
  # Python accepts traffic from Node pods + the ingress controller namespace.
  python:
    enabled: false
    ingressNamespaceSelector: {}      # e.g., { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
