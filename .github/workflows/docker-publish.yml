name: Build & push images to GHCR

on:
  push:
    tags:
      - "publish-image"
      - "publish-image-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag suffix (in addition to sha + latest)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: nodejs
            context: base_apps/nodejs
          - service: python
            context: base_apps/python
          - service: spring-java
            context: base_apps/spring-java
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Single repo shared by all services; differentiate by tag prefix.
          # Triggered by git tag publish-image[-suffix]; suffix becomes the image tag (else 'latest').
          tags: |
            type=raw,value=${{ matrix.service }}-latest,enable=${{ github.ref == 'refs/tags/publish-image' || github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=${{ matrix.service }}-,format=short
            type=match,pattern=^publish-image-(.*)$,group=1,prefix=${{ matrix.service }}-
            type=raw,value=${{ matrix.service }}-${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
