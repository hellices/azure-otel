[project]
name = "edge-api"
version = "1.0.0"
description = "FastAPI proxy in front of the Spring Boot items service"
requires-python = ">=3.13"
dependencies = [
    # https://fastapi.tiangolo.com/#installation
    # The "standard" extra installs uvicorn[standard], httpx, jinja2, python-multipart, etc.
    "fastapi[standard]>=0.121.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
